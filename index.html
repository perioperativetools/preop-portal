<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Perioperative Tools | Proof of Concept</title>
  <meta
    name="description"
    content="Proof-of-concept portal for perioperative predictive decision-support tools."
  />

  <style>
    :root {
      --text: #f7fbff;
      --muted: rgba(235, 244, 255, 0.72);
      --line: rgba(255, 255, 255, 0.14);
      --card: rgba(7, 15, 32, 0.52);
      --card-hover: rgba(13, 27, 53, 0.72);
      --glow: rgba(134, 197, 255, 0.22);
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #050914;
    }

    /* Milky Way image sits deliberately far back behind a dark overlay. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        url("https://npgallery.nps.gov/GetAsset/8626ef17-8163-4b4e-a742-d7439506f6d6/original.jpg")
        center 58% / cover no-repeat;
      transform: scale(1.02);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 48% 24%, rgba(73, 112, 165, 0.10), transparent 38%),
        linear-gradient(
          to bottom,
          rgba(2, 7, 17, 0.28) 0%,
          rgba(2, 7, 17, 0.61) 55%,
          rgba(2, 7, 17, 0.91) 100%
        );
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header,
    main,
    footer {
      width: min(calc(100% - 40px), var(--max-width));
      margin-inline: auto;
    }

    header {
      padding: 34px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.88);
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(12px);
    }

    .prototype {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(5, 12, 28, 0.34);
      backdrop-filter: blur(10px);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 0 86px;
    }

    .intro {
      max-width: 850px;
      margin-bottom: 52px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 8vw, 7.2rem);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 720;
      text-wrap: balance;
      text-shadow: 0 8px 45px rgba(0,0,0,0.38);
    }

    .subtitle {
      margin: 26px 0 0;
      max-width: 650px;
      font-size: clamp(1.04rem, 2.2vw, 1.34rem);
      line-height: 1.55;
      color: var(--muted);
      text-wrap: balance;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .tool {
      position: relative;
      min-height: 185px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
      overflow: hidden;
    }

    .tool::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -50px;
      top: -50px;
      border-radius: 50%;
      background: var(--glow);
      filter: blur(34px);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .tool:hover,
    .tool:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(191, 223, 255, 0.42);
      background: var(--card-hover);
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(153, 211, 255, 0.05);
      outline: none;
    }

    .tool:hover::before,
    .tool:focus-visible::before {
      opacity: 1;
    }


    .tool-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 15px;
      background: rgba(255,255,255,0.055);
      color: rgba(238, 247, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
    }

    .tool-icon svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .tool-number {
      color: rgba(218, 233, 255, 0.46);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .tool-bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .tool h2 {
      margin: 0;
      max-width: 180px;
      font-size: 1.18rem;
      line-height: 1.16;
      letter-spacing: -0.025em;
      font-weight: 650;
    }

    .arrow {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      background: rgba(255,255,255,0.045);
      font-size: 1.08rem;
      transition:
        transform 180ms ease,
        background 180ms ease;
    }

    .tool:hover .arrow,
    .tool:focus-visible .arrow {
      transform: translate(2px, -2px);
      background: rgba(255,255,255,0.10);
    }

    footer {
      padding: 22px 0 30px;
      display: flex;
      justify-content: space-between;
      gap: 28px;
      border-top: 1px solid rgba(255,255,255,0.09);
      color: rgba(222, 235, 252, 0.46);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .tools {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      header {
        padding-top: 24px;
      }

      .brand span:last-child {
        display: none;
      }

      main {
        justify-content: flex-start;
        padding-top: 72px;
      }

      .intro {
        margin-bottom: 36px;
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .tool {
        min-height: 132px;
      }

      .tool h2 {
        max-width: none;
      }

      footer {
        flex-direction: column;
      }

      .credit {
        text-align: left;
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Perioperative Tools</span>
      </div>
      <div class="prototype">Proof of concept</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Perioperative<br />Tools</h1>
        <p class="subtitle">
          Proof-of-concept predictive decision-support tools for pre-operative care.
        </p>
      </section>

      <nav class="tools" aria-label="Perioperative tools">

        <!-- TOOL 1 -->
        <a
          class="tool"
          href="https://perioperativetools.github.io/periop-echo/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="tool-top">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M3 12h3l1.8-4.2L11 17l2.2-6 1.6 3H21"/>
                <path d="M12 21C7.5 18.4 4 15.4 4 10.7A4.2 4.2 0 0 1 11.2 7.8L12 8.7l.8-.9A4.2 4.2 0 0 1 20 10.7"/>
              </svg>
            </span>
            <span class="tool-number">01</span>
          </span>
          <span class="tool-bottom">
            <h2>Perioperative Echo</h2>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </a>

        <!-- TOOL 2 -->
        <a
          class="tool"
          href="https://perioperativetools.github.io/preop-anaemia/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="tool-top">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 2.8S6.6 9.4 6.6 14a5.4 5.4 0 0 0 10.8 0C17.4 9.4 12 2.8 12 2.8Z"/>
                <path d="M9.5 15.2c.5 1.3 1.4 2 2.7 2.2"/>
              </svg>
            </span>
            <span class="tool-number">02</span>
          </span>
          <span class="tool-bottom">
            <h2>Pre-op Anaemia</h2>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </a>

        <!-- TOOL 3 -->
        <a
          class="tool"
          href="https://perioperativetools.github.io/preop-HBA1C/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="tool-top">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="5" y="3" width="14" height="18" rx="3"/>
                <path d="M9 7h6M9 11h6"/>
                <path d="M12 15.3s-2 2.1-2 3.2a2 2 0 0 0 4 0c0-1.1-2-3.2-2-3.2Z"/>
              </svg>
            </span>
            <span class="tool-number">03</span>
          </span>
          <span class="tool-bottom">
            <h2>Pre-op HbA1c</h2>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </a>

        <!-- TOOL 4 -->
        <a
          class="tool"
          href="https://perioperativetools.github.io/preop-weekendexclusion/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="tool-top">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="3"/>
                <path d="M8 3v4M16 3v4M3 10h18"/>
                <path d="m8.5 15 2.1 2.1 4.9-5"/>
              </svg>
            </span>
            <span class="tool-number">04</span>
          </span>
          <span class="tool-bottom">
            <h2>Weekend Suitability</h2>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </a>

        <!--
          TO ADD ANOTHER TOOL:
          Copy one <a class="tool">...</a> block above,
          change its number, title and href.
        -->

      </nav>
    </main>

    <footer>
      <div>
        Prototype only · Decision support only · Subject to revision.
      </div>
    </footer>
  </div>
</body>
</html>
